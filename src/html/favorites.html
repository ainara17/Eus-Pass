<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis favoritos</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/generalStyles.css">

    <link rel="stylesheet" href="../css/exploreStyles.css">

    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

</head>

<body>
     <!-- Bloqueo para pantallas que no sean mobile -->
    <div id="desktop-blocker" class="desktop-blocker">
        <div class="blocker-content">
            <h2>Vista no disponible en escritorio</h2>
            <p>Reduce el ancho de la ventana o accede desde tu móvil.</p>
           
        </div>
    </div>
    
    <nav id="arrow-favorites">
        <ul>
            <li class="back-arrow"><a href="explore.html"><i class="fa-solid fa-angle-left"></i></a></li>
        </ul>
    </nav>

    <main id="favorites-main">

        <header id="top-bar-container">

            <form id="filter-form">
                <label for="province-select"><i class="fa-solid fa-location-dot"></i></label>
                <select name="province-select" id="province-select">
                    <option value="all">Todas las provincias</option>
                </select>

            </form>

            <form id="search-form" class="search-container">
                <input type="text" id="search-input" placeholder="Buscar eventos, municipios..." />
                <button type="submit" id="search-btn" class="search-btn" aria-label="Buscar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>


            </select>
            <div id="type-filters-container" class="type-filters-flex"></div>
            <button id="clean-fav-btn" class="clean-fav-btn">Borrar favoritos</button>

        </header>

        <section id="favorites-list"></section>

    </main>


    <script type="module" src="../core/Favorites.js"></script>

</body>

</html>
