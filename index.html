<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euskadi Pass</title>

    <link rel="stylesheet" href="src/css/generalStyles.css">
    <link rel="stylesheet" href="src/css/indexStyles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

</head>

<body>

    <!-- Bloqueo para pantallas que no sean mobile -->
    <div id="desktop-blocker" class="desktop-blocker">
        <div class="blocker-content">
            <h2>Vista no disponible en escritorio</h2>
            <p>Reduce el ancho de la ventana o accede desde tu móvil.</p>
           
        </div>
    </div>

    <!--  Menu -->
    <header>
        <nav id="bottom-menu">
            <ul>
                <li class="nav-item active">



                    <a class="nav-link active" href="/">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="src/html/explore.html">
                        <i class="fa-solid fa-compass"></i>
                        <span>Explorar</span>

                    </a>
                </li>

                <li class="nav-item ">
                    <a class="nav-link" href="src/html/pass.html">
                        <i class="fa-solid fa-passport"></i>
                        <span>Pass</span>
                    </a>
                </li>
                <li class="nav-item ">
                    <i class="fa-solid fa-user"></i>
                    <a class="nav-link " href="src/html/profile.html">
                        <span>Perfil</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <header class="home-header">
            <div class="welcome-container">
                <h1>Ongi etorri!</h1>
                <p>Asiste a eventos, escanea QR y rellena tu pasaporte</p>
            </div>
            <button id="notification-btn" class="btn-notification" aria-label="Notificaciones">
                <i class="fa-solid fa-bell"></i>
            </button>
        </header>

        <section class="mission-card">
            <h3 class="mission-title"> Explorador de Bilbao</h3>
            <p></p>

            <!-- Barra de progreso -->
            <div class="progress-bar-container">
                <div id="mission-progress-fill" class="progress-bar-fill" style="width: 20%;"></div>
            </div>

            <div class="mission-header">
                <span id="mission-counter" class="mission-counter">1 / 5 eventos</span>
                <span class="mission-tag">Activo</span>
            </div>

        </section>

        <section class="recommended-section">
            <div class="section-title-wrapper">
                <h2>Recomendados</h2>
            </div>

            <section id="event-list"></section>
        </section>

    </main>

    <script type="module" src="./src/core/index.js"></script>
